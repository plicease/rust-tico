# tico's built-in default syntax theme, in Helix's theme format (see
# src/theme.rs for the format, and https://docs.helix-editor.com/themes.html
# for the full scope list).
#
# This is deliberately a 16-color theme with no backgrounds, so it takes
# its actual colors from the terminal's own palette, the way nano's
# highlighting does. It reproduces the palette tico had hardcoded before
# themes existed (green comments, yellow strings, magenta numbers, blue
# keywords - loosely the conventions of nano's shipped nanorc files),
# plus a handful of scopes that palette had no way to express.
#
# Terminal color names follow Helix: plain names ("yellow") are the
# normal-intensity colors, "light-*" are the bright ones, "gray" is
# bright black, "light-gray" is normal white, "white" is bright white.

"comment" = "green"

"string" = "light-yellow"
"string.special" = "light-yellow"
"constant.character.escape" = "light-cyan"

"constant" = "magenta"
"constant.numeric" = "light-magenta"
"constant.builtin.boolean" = "magenta"

"keyword" = "light-blue"
"label" = "light-blue"

"function" = "light-cyan"
"constructor" = "light-cyan"

"type" = "yellow"

"variable" = "cyan"
"variable.parameter" = "cyan"
"variable.other.member" = "cyan"

"namespace" = "blue"
"attribute" = "light-green"
"tag" = "light-red"

# Markup (markdown & co.)
"markup.heading" = { fg = "light-blue", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "light-yellow", modifiers = ["underlined"] }
"markup.link.text" = "light-cyan"
"markup.link.label" = "light-yellow"
"markup.raw" = "light-yellow"
"markup.list" = "light-red"
"markup.quote" = "green"

# Diffs: the conventional green-for-added, red-for-removed, used both for
# .diff/.patch files and tico's own merge-conflict viewer.
"diff.plus" = "light-green"
"diff.minus" = "light-red"
"diff.delta" = "light-yellow"
