name: Release

on:
  push:
    branches: [main]


concurrency: release-${{ github.ref }}


permissions:
  contents: write


jobs:
  release:
    uses: uperl/action-rust-release-bin/.github/workflows/release.yml@v1
    with:
      publisher: "plicease"
      extra-bin-names: "tcat ttee"
      # LICENSE-MPL-2.0 covers the vendored Helix themes; it must ship
      # alongside LICENSE (the action's default is "README.md LICENSE").
      extra-files: "README.md LICENSE LICENSE-MPL-2.0"

