[package]
name = "tico"
version = "0.1.0"
edition = "2024"
description = "Yet Another Text Editor"
repository = "https://github.com/plicease/tico"
# MIT, except src/syntax/queries/diff.scm (copied from Helix, MPL-2.0);
# see README.md and src/syntax/queries/README.md.
license = "MIT AND MPL-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
regex = "1.13.1"
ropey = "1.6.1"
rustix = { version = "1.1.5", features = ["fs", "system"] }
similar = "3.2.0"
thiserror = "2.0.20"
toml = "1.1.6"
tree-sitter = "0.26"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.2.1"
tree-sitter-haskell = "0.23.1"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = "0.23.1"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-nim = "0.1.0"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-perl = "1.1.2"
tree-sitter-php = "0.24.2"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-scss = "1.0.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-vim = "0.4.0"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[package.metadata.deb]
maintainer = "Nobody <devnull@wdlabs.com>"
copyright = "Nobody"
extended-description = """\
Yet Another Text Editor"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/tico", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tico/README.md", "644"],
    ["LICENSE", "usr/share/doc/tico/LICENSE", "644"],
]

